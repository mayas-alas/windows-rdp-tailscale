name: Windows 11 GNX lab via Dockur

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Duración del host después de que RDP esté listo
        required: true
        default: "240"
        type: choice
        options:
          - "60"
          - "120"
          - "180"
          - "240"
          - "300"

concurrency:
  group: dockur-windows-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dockur-windows:
    name: Dockur Windows 11 GNX host
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      RDP_USERNAME: gnxlab
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      DOCKUR_IMAGE: docker.io/dockurr/windows@sha256:8cc6f8bc4a60c078141fd3bcf7d2df69ae063a11d98be31a57429afe0dca66da

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          TS_RDP_AUTH_KEY: ${{ secrets.TS_RDP_AUTH_KEY }}
        run: |
          set -euo pipefail

          [[ -n "${TS_RDP_AUTH_KEY}" ]] || {
            echo "::error::Missing GitHub secret TS_RDP_AUTH_KEY."
            exit 1
          }
          [[ ${#RDP_PASSWORD} -ge 12 && ${#RDP_PASSWORD} -le 127 ]] || {
            echo "::error::RDP_PASSWORD must contain 12 to 127 characters."
            exit 1
          }
          [[ "${SESSION_MINUTES}" =~ ^(60|120|180|240|300)$ ]] || {
            echo "::error::Unsupported session duration."
            exit 1
          }

      - name: Reclaim ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail

          paths=(
            /usr/local/lib/android
            /usr/share/dotnet
            /opt/ghc
            /usr/local/.ghcup
            /opt/hostedtoolcache/CodeQL
          )
          for path in "${paths[@]}"; do
            if [[ -e "${path}" ]]; then
              sudo rm -rf -- "${path}"
            fi
          done

          sudo apt-get clean
          docker system prune --all --force --volumes
          df -h /

      - name: Gate KVM, nested virtualization, memory, and disk
        shell: bash
        run: |
          set -euo pipefail

          [[ -c /dev/kvm ]] || {
            echo "::error::The runner does not expose /dev/kvm."
            exit 1
          }
          [[ -c /dev/net/tun ]] || {
            echo "::error::The runner does not expose /dev/net/tun."
            exit 1
          }

          sudo chmod 0666 /dev/kvm

          python3 - <<'PY'
          import fcntl
          import os

          descriptor = os.open("/dev/kvm", os.O_RDWR | os.O_CLOEXEC)
          try:
              api_version = fcntl.ioctl(descriptor, 0xAE00, 0)
          finally:
              os.close(descriptor)
          if api_version != 12:
              raise SystemExit(f"KVM API version is {api_version}, expected 12")
          print("KVM_API_VERSION=12")
          PY

          grep -Eqm1 '(^|[[:space:]])(vmx|svm)($|[[:space:]])' /proc/cpuinfo || {
            echo "::error::The runner CPU does not expose VMX or SVM."
            exit 1
          }

          nested=""
          parameters=(
            /sys/module/kvm_intel/parameters/nested
            /sys/module/kvm_amd/parameters/nested
          )
          for parameter in "${parameters[@]}"; do
            if [[ -r "${parameter}" ]]; then
              nested="$(tr -d '[:space:]' < "${parameter}")"
              break
            fi
          done
          [[ "${nested^^}" == "Y" || "${nested}" == "1" ]] || {
            echo "::error::Nested KVM is not enabled on this runner."
            exit 1
          }

          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          free_disk_gib="$(df -Pk / | awk 'NR == 2 { print int($4 / 1024 / 1024) }')"
          cpu_count="$(nproc)"

          (( memory_kib >= 15 * 1024 * 1024 )) || {
            echo "::error::At least 15 GiB host RAM is required for the 12 GiB Windows guest."
            exit 1
          }
          (( free_disk_gib >= 36 )) || {
            echo "::error::At least 36 GiB free disk is required after runner cleanup; found ${free_disk_gib} GiB."
            exit 1
          }

          {
            echo "## Dockur host preflight"
            echo
            echo "- KVM API: 12"
            echo "- Nested KVM: ${nested}"
            echo "- Runner CPUs: ${cpu_count}; Windows vCPUs: 6 (overcommitted)"
            echo "- Runner RAM: $((memory_kib / 1024 / 1024)) GiB; Windows RAM: 12 GiB"
            echo "- Free disk after cleanup: ${free_disk_gib} GiB"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Connect the RDP edge to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TS_RDP_AUTH_KEY }}
          tags: tag:github-rdp
          hostname: github-dockur-${{ github.run_id }}
          version: 1.98.8
          timeout: 3m
          retry: "5"
          use-cache: "true"

      - name: Start the pinned Dockur Windows 11 guest
        shell: bash
        run: |
          set -euo pipefail

          storage="${RUNNER_TEMP}/gnx-windows"
          mkdir -p "${storage}"
          docker pull "${DOCKUR_IMAGE}"

          docker_args=(
            --detach
            --name gnx-windows
            --device /dev/kvm
            --device /dev/net/tun
            --cap-add NET_ADMIN
            --env VERSION=11
            --env CPU_CORES=6
            --env RAM_SIZE=12G
            --env DISK_SIZE=100G
            --env VMX=Y
            --env LANGUAGE=English
            --env REGION=en-US
            --env KEYBOARD=en-US
            --env "USERNAME=${RDP_USERNAME}"
            --env PASSWORD
            --publish 127.0.0.1:3389:3389/tcp
            --publish 127.0.0.1:8006:8006/tcp
            --volume "${storage}:/storage"
            --stop-timeout 120
          )
          docker run "${docker_args[@]}" "${DOCKUR_IMAGE}"

      - name: Wait for the Windows RDP listener
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/rdp_probe.py" <<'PY'
          import socket

          request = bytes.fromhex("030000130ee00000000000010008000b000000")
          try:
              with socket.create_connection(("127.0.0.1", 3389), timeout=2) as connection:
                  connection.settimeout(2)
                  connection.sendall(request)
                  response = b""
                  while len(response) < 11:
                      chunk = connection.recv(64)
                      if not chunk:
                          break
                      response += chunk
          except OSError:
              raise SystemExit(1)

          if (
              len(response) < 11
              or response[:2] != b"\x03\x00"
              or int.from_bytes(response[2:4], "big") < 11
              or response[5] & 0xF0 != 0xD0
          ):
              raise SystemExit(1)
          PY

          ready=false
          for attempt in $(seq 1 200); do
            state="$(docker inspect --format '{{.State.Status}}' gnx-windows 2>/dev/null || true)"
            if [[ "${state}" != "running" ]]; then
              echo "::error::Dockur exited before Windows became ready."
              docker logs gnx-windows 2>&1 |
                grep -Ei 'error|fail|fatal|kvm|space|memory' |
                tail -n 80 || true
              exit 1
            fi

            if python3 "${RUNNER_TEMP}/rdp_probe.py"; then
              ready=true
              break
            fi

            if (( attempt % 20 == 0 )); then
              echo "Waiting for Windows RDP: attempt ${attempt}/200"
            fi
            sleep 15
          done

          [[ "${ready}" == "true" ]] || {
            echo "::error::Windows did not expose RDP within 50 minutes."
            docker logs gnx-windows 2>&1 |
              grep -Ei 'error|fail|fatal|kvm|space|memory' |
              tail -n 80 || true
            exit 1
          }

      - name: Publish RDP only inside the tailnet
        shell: bash
        run: |
          set -euo pipefail

          sudo tailscale serve --bg --tcp=3389 tcp://127.0.0.1:3389
          sudo tailscale serve status --json >/dev/null

          tailscale_ipv4="$(tailscale ip -4 | head -n 1)"
          dns_name="$(
            tailscale status --json |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["Self"].get("DNSName", "").rstrip("."))'
          )"

          [[ -n "${tailscale_ipv4}" ]] || {
            echo "::error::Tailscale did not expose an IPv4 address."
            exit 1
          }

          {
            echo
            echo "## Windows 11 GNX candidate ready"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Tailscale IPv4 | ${tailscale_ipv4} |"
            echo "| MagicDNS | ${dns_name:-unavailable} |"
            echo "| Username | ${RDP_USERNAME} |"
            echo "| Port | 3389 |"
            echo "| Session after readiness | ${SESSION_MINUTES} minutes |"
            echo
            echo "RDP terminates in the Dockur Windows guest. Run the unchanged Quetzalcoatl installer there; HostPreflight remains the authority for WSL2 and nested KVM."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the candidate host alive
        shell: bash
        run: |
          set -euo pipefail

          finish_at=$(($(date +%s) + SESSION_MINUTES * 60))
          while (( $(date +%s) < finish_at )); do
            state="$(docker inspect --format '{{.State.Status}}' gnx-windows 2>/dev/null || true)"
            [[ "${state}" == "running" ]] || {
              echo "::error::Dockur stopped before the requested session ended."
              exit 1
            }

            if timeout 2 bash -c '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
              echo "[$(date --iso-8601=seconds)] Dockur is running; RDP is listening."
            else
              echo "[$(date --iso-8601=seconds)] Dockur is running; Windows is rebooting or RDP is temporarily unavailable."
            fi
            sleep 60
          done

      - name: Cleanup the ephemeral host
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale serve reset
          docker stop --time 120 gnx-windows
          docker rm --force gnx-windows
