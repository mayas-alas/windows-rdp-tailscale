name: Windows RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Duración de la sesión RDP"
        required: true
        default: "330"
        type: choice
        options:
          - "60"
          - "120"
          - "180"
          - "240"
          - "300"
          - "330"

# Evita levantar accidentalmente dos escritorios remotos al mismo tiempo.
concurrency:
  group: windows-rdp-${{ github.repository }}
  cancel-in-progress: false

# El workflow no necesita escribir en el repositorio.
permissions: {}

jobs:
  windows-rdp:
    name: Windows RDP
    runs-on: windows-latest

    # GitHub limita los runners hospedados a seis horas.
    # Dejamos margen para instalación, conexión y limpieza.
    timeout-minutes: 355

    env:
      RDP_USERNAME: ghrdp
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}

    steps:
      - name: Validate required secrets
        shell: pwsh
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_CLIENT_ID)) {
              throw "Missing GitHub secret: TS_OAUTH_CLIENT_ID"
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_CLIENT_SECRET)) {
              throw "Missing GitHub secret: TS_OAUTH_SECRET"
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "Missing GitHub secret: RDP_PASSWORD"
          }

          if ($env:RDP_PASSWORD.Length -lt 12) {
              throw "RDP_PASSWORD must contain at least 12 characters."
          }

          if ($env:RDP_PASSWORD.Length -gt 127) {
              throw "RDP_PASSWORD cannot exceed 127 characters."
          }

          Write-Host "Required secrets are configured."

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-rdp
          hostname: github-rdp-${{ github.run_id }}
          version: latest
          timeout: 3m
          retry: "5"
          use-cache: "true"
          log-mode: normal

      - name: Configure Windows RDP
        id: configure-rdp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME
          $password = ConvertTo-SecureString `
              -String $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          Write-Host "Creating or updating local RDP account..."

          $existingUser = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {
              New-LocalUser `
                  -Name $username `
                  -Password $password `
                  -Description "Temporary GitHub RDP account" `
                  -PasswordNeverExpires `
                  -AccountNeverExpires
          }
          else {
              Set-LocalUser `
                  -Name $username `
                  -Password $password `
                  -Description "Temporary GitHub RDP account"

              Set-LocalUser `
                  -Name $username `
                  -PasswordNeverExpires $true `
                  -AccountNeverExpires
          }

          Enable-LocalUser -Name $username

          # Usamos SID para no depender del idioma de Windows.
          $administratorsGroup = (
              New-Object System.Security.Principal.SecurityIdentifier(
                  "S-1-5-32-544"
              )
          ).Translate(
              [System.Security.Principal.NTAccount]
          ).Value.Split('\')[-1]

          $remoteDesktopGroup = (
              New-Object System.Security.Principal.SecurityIdentifier(
                  "S-1-5-32-555"
              )
          ).Translate(
              [System.Security.Principal.NTAccount]
          ).Value.Split('\')[-1]

          Add-LocalGroupMember `
              -Group $administratorsGroup `
              -Member $username `
              -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
              -Group $remoteDesktopGroup `
              -Member $username `
              -ErrorAction SilentlyContinue

          Write-Host "Enabling Remote Desktop..."

          $terminalServerPath = `
              "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"

          $rdpTcpPath = `
              "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          # Habilita conexiones RDP.
          Set-ItemProperty `
              -Path $terminalServerPath `
              -Name "fDenyTSConnections" `
              -Type DWord `
              -Value 0

          # Obliga Network Level Authentication.
          Set-ItemProperty `
              -Path $rdpTcpPath `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 1

          # TLS como capa de seguridad.
          Set-ItemProperty `
              -Path $rdpTcpPath `
              -Name "SecurityLayer" `
              -Type DWord `
              -Value 2

          # Cifrado alto.
          Set-ItemProperty `
              -Path $rdpTcpPath `
              -Name "MinEncryptionLevel" `
              -Type DWord `
              -Value 3

          Set-Service `
              -Name "TermService" `
              -StartupType Automatic

          Start-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

          Write-Host "Creating Tailscale-only firewall rules..."

          Get-NetFirewallRule `
              -DisplayName "GitHub RDP via Tailscale*" `
              -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule `
                  -ErrorAction SilentlyContinue

          # CGNAT IPv4 usado por nodos Tailscale.
          New-NetFirewallRule `
              -DisplayName "GitHub RDP via Tailscale TCP" `
              -Description "Allow RDP TCP only through Tailscale" `
              -Direction Inbound `
              -Action Allow `
              -Enabled True `
              -Profile Any `
              -Protocol TCP `
              -LocalPort 3389 `
              -RemoteAddress "100.64.0.0/10"

          New-NetFirewallRule `
              -DisplayName "GitHub RDP via Tailscale UDP" `
              -Description "Allow RDP UDP only through Tailscale" `
              -Direction Inbound `
              -Action Allow `
              -Enabled True `
              -Profile Any `
              -Protocol UDP `
              -LocalPort 3389 `
              -RemoteAddress "100.64.0.0/10"

          # IPv6 ULA reservado por Tailscale.
          New-NetFirewallRule `
              -DisplayName "GitHub RDP via Tailscale IPv6 TCP" `
              -Description "Allow RDP TCP through Tailscale IPv6" `
              -Direction Inbound `
              -Action Allow `
              -Enabled True `
              -Profile Any `
              -Protocol TCP `
              -LocalPort 3389 `
              -RemoteAddress "fd7a:115c:a1e0::/48"

          New-NetFirewallRule `
              -DisplayName "GitHub RDP via Tailscale IPv6 UDP" `
              -Description "Allow RDP UDP through Tailscale IPv6" `
              -Direction Inbound `
              -Action Allow `
              -Enabled True `
              -Profile Any `
              -Protocol UDP `
              -LocalPort 3389 `
              -RemoteAddress "fd7a:115c:a1e0::/48"

          Restart-Service -Name "TermService"

          $service = Get-Service -Name "TermService"

          if ($service.Status -ne "Running") {
              throw "Remote Desktop Services did not start correctly."
          }

          $rdpListening = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $rdpListening) {
              Start-Sleep -Seconds 5

              $rdpListening = Get-NetTCPConnection `
                  -LocalPort 3389 `
                  -State Listen `
                  -ErrorAction SilentlyContinue
          }

          if ($null -eq $rdpListening) {
              throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "RDP configuration completed."

      - name: Publish connection details
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tailscaleIPv4 = (
              tailscale.exe ip -4 |
              Select-Object -First 1
          ).Trim()

          $tailscaleIPv6 = (
              tailscale.exe ip -6 |
              Select-Object -First 1
          ).Trim()

          $tailscaleStatus = tailscale.exe status --json |
              ConvertFrom-Json

          $dnsName = $tailscaleStatus.Self.DNSName.TrimEnd('.')

          if ([string]::IsNullOrWhiteSpace($tailscaleIPv4)) {
              throw "Could not determine the Tailscale IPv4 address."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " WINDOWS RDP READY"
          Write-Host "=============================================="
          Write-Host "IPv4:     $tailscaleIPv4"
          Write-Host "IPv6:     $tailscaleIPv6"
          Write-Host "Hostname: $dnsName"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Port:     3389"
          Write-Host "=============================================="
          Write-Host ""

          @"
          # Windows RDP ready

          | Setting | Value |
          |---|---|
          | Tailscale IPv4 | ``$tailscaleIPv4`` |
          | Tailscale IPv6 | ``$tailscaleIPv6`` |
          | MagicDNS | ``$dnsName`` |
          | Username | ``$env:RDP_USERNAME`` |
          | Port | ``3389`` |
          | Session duration | ``$env:SESSION_MINUTES minutes`` |

          ## Connect from Windows

          Press **Win + R** and execute:

          ``````
          mstsc.exe
          ``````

          Use the Tailscale IPv4 or MagicDNS hostname shown above.

          The password is the value stored in the GitHub secret
          ``RDP_PASSWORD``.
          "@ | Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append

      - name: Keep RDP session alive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $minutes = 0

          if (-not [int]::TryParse(
              $env:SESSION_MINUTES,
              [ref]$minutes
          )) {
              throw "Invalid session duration."
          }

          if ($minutes -lt 1 -or $minutes -gt 330) {
              throw "Session duration must be between 1 and 330 minutes."
          }

          $finishAt = (Get-Date).AddMinutes($minutes)

          Write-Host "RDP runner will remain active until approximately:"
          Write-Host $finishAt.ToString("yyyy-MM-dd HH:mm:ss K")
          Write-Host ""
          Write-Host "You can cancel the workflow manually when finished."

          while ((Get-Date) -lt $finishAt) {
              $remaining = [math]::Ceiling(
                  ($finishAt - (Get-Date)).TotalMinutes
              )

              $tailscaleIP = (
                  tailscale.exe ip -4 |
                  Select-Object -First 1
              ).Trim()

              $termService = Get-Service -Name "TermService"

              if ($termService.Status -ne "Running") {
                  Write-Warning "TermService stopped. Starting it again..."
                  Start-Service -Name "TermService"
              }

              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] " `
                  "RDP active at $tailscaleIP - " `
                  "$remaining minute(s) remaining."

              Start-Sleep -Seconds 60
          }

          Write-Host "Requested RDP session duration completed."

      - name: Cleanup RDP configuration
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Removing temporary firewall rules..."

          Get-NetFirewallRule `
              -DisplayName "GitHub RDP via Tailscale*" `
              -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule `
                  -ErrorAction SilentlyContinue

          Write-Host "Removing temporary local account..."

          $existingUser = Get-LocalUser `
              -Name $env:RDP_USERNAME `
              -ErrorAction SilentlyContinue

          if ($null -ne $existingUser) {
              Remove-LocalUser `
                  -Name $env:RDP_USERNAME `
                  -ErrorAction SilentlyContinue
          }

          Write-Host "Cleanup completed."
