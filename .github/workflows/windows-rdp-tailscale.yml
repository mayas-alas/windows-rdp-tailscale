name: GNX Dockur interactive compatibility lab

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Test prerelease tag containing the frozen GNX setup asset
        required: true
        type: string
      expected_sha256:
        description: SHA-256 for Quetzalcoatl-0.1.3-setup-x64.exe
        required: true
        type: string
      slot:
        description: Deterministic logical compatibility slot
        required: true
        default: controller
        type: choice
        options: [controller, member-1, member-2]
      session_minutes:
        description: Bounded interactive noVNC session after the viewer is ready
        required: true
        default: "120"
        type: choice
        options: ["60", "120", "180"]
      hyperv_mode:
        description: QEMU Hyper-V exposure strategy for the Windows guest
        required: true
        default: explicit-nested
        type: choice
        options: [explicit-nested, passthrough, disabled]
      runner_image:
        description: GitHub-hosted Linux image used for the Dockur VM
        required: true
        default: ubuntu-22.04
        type: choice
        options: [ubuntu-22.04, ubuntu-24.04]
permissions:
  contents: read

concurrency:
  group: gnx-dockur-${{ github.repository }}-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  dockur-compatibility:
    name: Dockur ${{ inputs.slot }} interactive compatibility
    runs-on: ${{ inputs.runner_image }}
    timeout-minutes: 355
    env:
      DOCKUR_IMAGE: docker.io/dockurr/windows@sha256:8cc6f8bc4a60c078141fd3bcf7d2df69ae063a11d98be31a57429afe0dca66da
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      SLOT: ${{ inputs.slot }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      HYPERV_MODE: ${{ inputs.hyperv_mode }}
      RUNNER_IMAGE: ${{ inputs.runner_image }}

    steps:
      - name: Validate inputs and access secrets
        shell: bash
        env:
          TS_RDP_AUTH_KEY: ${{ secrets.TS_RDP_AUTH_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo '::error::Invalid release_tag.'; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo '::error::expected_sha256 must be 64 hexadecimal characters.'; exit 1; }
          [[ "$SLOT" =~ ^(controller|member-1|member-2)$ ]] || { echo '::error::Invalid logical slot.'; exit 1; }
          [[ "$SESSION_MINUTES" =~ ^(60|120|180)$ ]] || { echo '::error::Invalid session duration.'; exit 1; }
          [[ "$HYPERV_MODE" =~ ^(explicit-nested|passthrough|disabled)$ ]] || { echo '::error::Invalid Hyper-V mode.'; exit 1; }
          [[ "$RUNNER_IMAGE" =~ ^ubuntu-(22\.04|24\.04)$ ]] || { echo '::error::Invalid runner image.'; exit 1; }
          [[ -n "$TS_RDP_AUTH_KEY" ]] || { echo '::error::Missing TS_RDP_AUTH_KEY for authenticated noVNC.'; exit 1; }

      - name: Reclaim ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            [[ -e "$path" ]] && sudo rm -rf -- "$path"
          done
          sudo apt-get clean
          docker system prune --all --force --volumes
          df -h /

      - name: Gate KVM API 12, nested virtualization, TUN, memory, and disk
        shell: bash
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]] || { echo '::error::The runner does not expose /dev/kvm.'; exit 1; }
          [[ -c /dev/net/tun ]] || { echo '::error::The runner does not expose /dev/net/tun.'; exit 1; }
          sudo chmod 0666 /dev/kvm
          python3 - <<'PY'
          import fcntl
          import os
          fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          try:
              api = fcntl.ioctl(fd, 0xAE00, 0)
          finally:
              os.close(fd)
          if api != 12:
              raise SystemExit(f'KVM API version is {api}, expected 12')
          print('KVM_API_VERSION=12')
          PY
          grep -Eqm1 '(^|[[:space:]])(vmx|svm)($|[[:space:]])' /proc/cpuinfo || { echo '::error::VMX/SVM is unavailable.'; exit 1; }
          nested=''
          for parameter in /sys/module/kvm_intel/parameters/nested /sys/module/kvm_amd/parameters/nested; do
            if [[ -r "$parameter" ]]; then nested="$(tr -d '[:space:]' < "$parameter")"; break; fi
          done
          [[ "${nested^^}" == Y || "$nested" == 1 ]] || { echo '::error::Nested KVM is not enabled.'; exit 1; }
          capabilities="$RUNNER_TEMP/kvm-capabilities.txt"
          {
            echo "kernel=$(uname -r)"
            grep -m1 '^model name' /proc/cpuinfo || true
            grep -m1 -E '^(vmx|svm) flags' /proc/cpuinfo || true
            for parameter in \
              /sys/module/kvm_intel/parameters/nested \
              /sys/module/kvm_intel/parameters/ept \
              /sys/module/kvm_intel/parameters/enable_shadow_vmcs \
              /sys/module/kvm_intel/parameters/enable_evmcs \
              /sys/module/kvm_intel/parameters/enable_apicv \
              /sys/module/kvm_amd/parameters/nested \
              /sys/module/kvm_amd/parameters/npt \
              /sys/module/kvm_amd/parameters/avic \
              /sys/module/kvm_amd/parameters/vgif; do
              [[ -r "$parameter" ]] && printf '%s=%s\n' "$(basename "$parameter")" "$(tr -d '[:space:]' < "$parameter")"
            done
          } > "$capabilities"
          memory_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          free_disk_gib="$(df -Pk / | awk 'NR == 2 {print int($4 / 1024 / 1024)}')"
          (( memory_kib >= 15 * 1024 * 1024 )) || { echo '::error::Need at least 15 GiB host RAM.'; exit 1; }
          (( free_disk_gib >= 36 )) || { echo "::error::Need 36 GiB free disk; found ${free_disk_gib} GiB."; exit 1; }
          {
            echo '## Dockur compatibility preflight'
            echo
            echo "- Logical slot: ${SLOT}"
            echo "- Runner image: ${RUNNER_IMAGE}"
            echo "- KVM API: 12; nested KVM: ${nested}; TUN: available"
            echo "- QEMU Hyper-V mode: ${HYPERV_MODE}; VMX exposure: enabled"
            echo "- Host RAM: $((memory_kib / 1024 / 1024)) GiB; free disk: ${free_disk_gib} GiB"
            echo '- Evidence class: hosted interactive compatibility session, not physical-lab cluster acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify frozen installer on the Linux host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oem"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Quetzalcoatl-0.1.3-setup-x64.exe' --dir "$RUNNER_TEMP/oem"
          installer="$RUNNER_TEMP/oem/Quetzalcoatl-0.1.3-setup-x64.exe"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          [[ "${actual,,}" == "${EXPECTED_SHA256,,}" ]] || { echo '::error::Frozen installer SHA-256 mismatch.'; exit 1; }

      - name: Create user-invoked guest helpers
        shell: bash
        run: |
          set -euo pipefail
          oem="$RUNNER_TEMP/oem"
          cat > "$oem/Install-GnxElevated.ps1" <<'PS'
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PSScriptRoot 'Quetzalcoatl-0.1.3-setup-x64.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Frozen installer is missing: $installer" }
          Start-Process -FilePath $installer -Verb RunAs -Wait
          PS
          cat > "$oem/Repair-GnxElevated.ps1" <<'PS'
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PSScriptRoot 'Quetzalcoatl-0.1.3-setup-x64.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Frozen installer is missing: $installer" }
          Start-Process -FilePath $installer -ArgumentList '/repair' -Verb RunAs -Wait
          PS
          cat > "$oem/Uninstall-GnxElevated.ps1" <<'PS'
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PSScriptRoot 'Quetzalcoatl-0.1.3-setup-x64.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Frozen installer is missing: $installer" }
          Start-Process -FilePath $installer -ArgumentList '/uninstall' -Verb RunAs -Wait
          PS
          cat > "$oem/Collect-GnxEvidence.ps1" <<'PS'
          param([switch]$SelfTest)
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          function Test-ExactPropertyNames($Object, [string[]]$Expected) {
            if ($null -eq $Object -or $Object -isnot [pscustomobject]) { return $false }
            $actual = @($Object.PSObject.Properties | ForEach-Object { $_.Name })
            return $actual.Count -eq $Expected.Count -and @($Expected | Where-Object { $_ -notin $actual }).Count -eq 0
          }
          function ConvertTo-SafeGnxStatus($Status) {
            if ($null -eq $Status -or $Status -isnot [pscustomobject]) { throw 'Unexpected GNX status schema.' }
            $statusKeys = @('schema_version', 'overall', 'stage', 'role', 'controller', 'components', 'cluster', 'services')
            $allowedStatusKeys = $statusKeys + 'last_error'
            $actualStatusKeys = @($Status.PSObject.Properties | ForEach-Object { $_.Name })
            $hasOnlyAllowedStatusKeys = @($actualStatusKeys | Where-Object { $_ -notin $allowedStatusKeys }).Count -eq 0
            $hasAllStatusKeys = @($statusKeys | Where-Object { $_ -notin $actualStatusKeys }).Count -eq 0
            if (-not $hasOnlyAllowedStatusKeys -or -not $hasAllStatusKeys -or
                ($Status.schema_version -isnot [int] -and $Status.schema_version -isnot [long]) -or $Status.schema_version -ne 1 -or
                $Status.overall -isnot [string] -or [string]::IsNullOrWhiteSpace($Status.overall) -or
                $Status.stage -isnot [string] -or [string]::IsNullOrWhiteSpace($Status.stage) -or
                ($null -ne $Status.role -and $Status.role -isnot [string]) -or
                ($null -ne $Status.controller -and $Status.controller -isnot [string]) -or
                -not (Test-ExactPropertyNames $Status.components @('service', 'wsl', 'podman_machine', 'kvm', 'tailscale', 'tailscale_serve', 'proxmox', 'opentofu')) -or
                -not (Test-ExactPropertyNames $Status.cluster @('joined', 'quorate')) -or
                -not (Test-ExactPropertyNames $Status.services @('garage', 'forgejo')) -or
                -not (@($Status.components.service, $Status.components.wsl, $Status.components.podman_machine, $Status.components.kvm, $Status.components.tailscale, $Status.components.tailscale_serve, $Status.components.proxmox, $Status.components.opentofu | Where-Object { $_ -isnot [string] }).Count -eq 0) -or
                $Status.cluster.joined -isnot [bool] -or $Status.cluster.quorate -isnot [bool] -or
                -not (@($Status.services.garage, $Status.services.forgejo | Where-Object { $_ -isnot [string] }).Count -eq 0)) {
              throw 'Unexpected GNX status schema.'
            }
            $safeStatus = [ordered]@{
              schema_version = $Status.schema_version
              overall = $Status.overall
              stage = $Status.stage
              role = $Status.role
              controller = $Status.controller
              components = [ordered]@{
                service = $Status.components.service
                wsl = $Status.components.wsl
                podman_machine = $Status.components.podman_machine
                kvm = $Status.components.kvm
                tailscale = $Status.components.tailscale
                tailscale_serve = $Status.components.tailscale_serve
                proxmox = $Status.components.proxmox
                opentofu = $Status.components.opentofu
              }
              cluster = [ordered]@{ joined = $Status.cluster.joined; quorate = $Status.cluster.quorate }
              services = [ordered]@{ garage = $Status.services.garage; forgejo = $Status.services.forgejo }
            }
            $lastError = $Status.PSObject.Properties['last_error']
            if ($null -ne $lastError -and $null -ne $lastError.Value) { $safeStatus.last_error = 'reported' }
            return $safeStatus
          }
          if ($SelfTest) {
            $base = [pscustomobject]@{
              schema_version = 1; overall = 'ready'; stage = 'configured'; role = $null; controller = $null
              components = [pscustomobject]@{ service='ok'; wsl='ok'; podman_machine='ok'; kvm='ok'; tailscale='ok'; tailscale_serve='ok'; proxmox='ok'; opentofu='ok' }
              cluster = [pscustomobject]@{ joined=$false; quorate=$false }
              services = [pscustomobject]@{ garage='ok'; forgejo='ok' }
              last_error = $null
            }
            $withoutLastError = ConvertTo-SafeGnxStatus $base
            if ($null -ne $withoutLastError.PSObject.Properties['last_error']) { throw 'Null last_error was not omitted.' }
            $base.last_error = 'sensitive detail'
            if ((ConvertTo-SafeGnxStatus $base).last_error -ne 'reported') { throw 'Non-null last_error was not transformed.' }
            exit 0
          }
          $desktop = [Environment]::GetFolderPath([Environment+SpecialFolder]::Desktop)
          $sharedRoots = @('Z:\')
          if (-not [string]::IsNullOrWhiteSpace($desktop)) {
            $sharedRoots += Join-Path $desktop 'Shared'
          }
          $out = $null
          foreach ($sharedRoot in $sharedRoots) {
            if (-not (Test-Path -LiteralPath $sharedRoot -PathType Container)) { continue }
            $probe = $null
            try {
              $candidate = Join-Path $sharedRoot 'gnx-evidence'
              New-Item -ItemType Directory -Force -Path $candidate | Out-Null
              $probe = Join-Path $candidate ('.gnx-write-probe-{0}.tmp' -f [guid]::NewGuid().ToString('N'))
              Set-Content -LiteralPath $probe -Value 'probe' -NoNewline -Encoding ascii
              Remove-Item -LiteralPath $probe -Force
              $out = $candidate
              break
            } catch {
              if ($null -ne $probe) { Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue }
              # Try the next documented Dockur shared-root location.
            }
          }
          if ($null -eq $out) {
            throw 'No supported writable Dockur shared root was found (checked Z:\ and the current user Desktop\Shared folder); evidence was not written.'
          }
          $installer = Join-Path $PSScriptRoot 'Quetzalcoatl-0.1.3-setup-x64.exe'
          $report = [ordered]@{ schemaVersion = 1; collectedAtUtc = (Get-Date).ToUniversalTime().ToString('o'); installerSha256 = $null; services = @(); binaryHashes = @(); gnxStatusJson = $null; gnxStatusError = $null }
          if (Test-Path -LiteralPath $installer) { $report.installerSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash }
          $report.services = @(Get-CimInstance Win32_Service | Where-Object { $_.Name -ieq 'Quetzalcoatl' } | ForEach-Object { [ordered]@{ name=[string]$_.Name; state=[string]$_.State; startMode=[string]$_.StartMode; startName=[string]$_.StartName } })
          $roots = @((Join-Path $env:ProgramFiles 'Quetzalcoatl'), (Join-Path ${env:ProgramFiles(x86)} 'Quetzalcoatl')) | Where-Object { Test-Path -LiteralPath $_ }
          $binaries = @(foreach ($root in $roots) { Get-ChildItem -LiteralPath $root -Recurse -File -Include *.exe,*.dll })
          $report.binaryHashes = @($binaries | ForEach-Object { [ordered]@{ path=$_.FullName.Substring($env:ProgramFiles.Length); sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } })
          $gnx = @($binaries | Where-Object { $_.Name -ieq 'gnx.exe' } | Select-Object -First 1)
          if ($gnx) {
            $statusOutput = (& $gnx.FullName status --json 2>$null | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              $report.gnxStatusError = 'status-command-exited-nonzero-before-interactive-configuration'
            } else {
              try {
                $status = $statusOutput | ConvertFrom-Json -ErrorAction Stop
                $safeStatus = ConvertTo-SafeGnxStatus $status
                $report.gnxStatusJson = $safeStatus | ConvertTo-Json -Depth 6 -Compress
              } catch {
                # Do not persist parser errors or command output.
              }
            }
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $out 'gnx-evidence.json') -Encoding utf8
          PS
          pwsh -NoLogo -NoProfile -File "$oem/Collect-GnxEvidence.ps1" -SelfTest
          cat > "$oem/01-Install-GNX.cmd" <<'BAT'
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0Install-GnxElevated.ps1"
          pause
          BAT
          cat > "$oem/02-Configure-GNX.cmd" <<'BAT'
          @echo off
          "%ProgramFiles%\Quetzalcoatl\gnx.exe" configure
          pause
          BAT
          cat > "$oem/03-Collect-GNX-Evidence.cmd" <<'BAT'
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0Collect-GnxEvidence.ps1"
          pause
          BAT
          cat > "$oem/90-Repair-GNX.cmd" <<'BAT'
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0Repair-GnxElevated.ps1"
          pause
          BAT
          cat > "$oem/99-Uninstall-GNX.cmd" <<'BAT'
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0Uninstall-GnxElevated.ps1"
          pause
          BAT
          test ! -e "$oem/install.bat"

      - name: Connect noVNC edge to the tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TS_RDP_AUTH_KEY }}
          tags: tag:github-rdp
          hostname: github-dockur-${{ inputs.slot }}-${{ github.run_id }}
          version: 1.98.8
          timeout: 3m
          retry: '5'
          use-cache: 'true'

      - name: Start the pinned Dockur Windows guest
        shell: bash
        run: |
          set -euo pipefail
          storage="$RUNNER_TEMP/gnx-windows-storage"
          shared="$RUNNER_TEMP/gnx-shared"
          mkdir -p "$storage" "$shared"
          password="$(openssl rand -hex 32)"
          export PASSWORD="$password"
          hv='Y'
          cpu_flags=''
          cpu_model=''
          case "$HYPERV_MODE" in
            disabled)
              hv='N'
              ;;
            explicit-nested)
              hv='N'
              # QEMU documents direct synthetic timers as required for nested
              # Hyper-V. Keep the production-safe set explicit and exclude
              # hv-passthrough, hv-crash, hv-reset, and Intel-only hv-evmcs.
              cpu_flags='hv-relaxed,hv-vapic,hv-spinlocks=0xfff,hv-vpindex,hv-runtime,hv-time,hv-synic,hv-stimer,hv-stimer-direct,hv-tlbflush,hv-ipi,hv-frequencies'
              if grep -qm1 'vendor_id.*GenuineIntel' /proc/cpuinfo; then
                # Recent Intel server models can boot-loop Windows 11 with
                # nested Hyper-V. Cascade Lake is the newest model confirmed
                # working by the upstream QEMU reproducer.
                cpu_model='Cascadelake-Server-noTSX'
                cpu_flags="+vmx,${cpu_flags},hv-evmcs"
              else
                echo '::error::The hosted runner is AMD. QEMU issue #3177 prevents Hyper-V/WSL from re-exposing SVM/NPT to the GNX Podman VM.'
                exit 1
              fi
              ;;
          esac
          docker pull "$DOCKUR_IMAGE"
          docker_args=(
            --detach --name gnx-dockur --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
            --env VERSION=11 --env CPU_CORES=6 --env RAM_SIZE=12G --env DISK_SIZE=100G
            --env VMX=Y --env "HV=$hv" --env "CPU_MODEL=$cpu_model" --env "CPU_FLAGS=$cpu_flags" --env DEBUG=Y
            --env LANGUAGE=English --env REGION=en-US --env KEYBOARD=en-US --env USERNAME=gnxlab --env PASSWORD
            --publish 127.0.0.1:8006:8006/tcp
            --volume "$storage:/storage" --volume "$RUNNER_TEMP/oem:/oem:ro" --volume "$shared:/shared"
            --stop-timeout 120
          )
          docker run "${docker_args[@]}" "$DOCKUR_IMAGE"
          unset PASSWORD password
          for attempt in $(seq 1 30); do
            if docker exec gnx-dockur sh -c 'pgrep -o qemu-system >/dev/null'; then break; fi
            sleep 2
          done
          {
            docker exec gnx-dockur qemu-system-x86_64 --version | head -n 1
            docker exec gnx-dockur sh -c 'pid="$(pgrep -o qemu-system)"; tr "\0" "\n" < "/proc/$pid/cmdline"' |
              awk 'previous == "-cpu" { print "cpu=" $0 } /^-cpu=/ { print "cpu=" substr($0, 6) } { previous=$0 }'
          } > "$RUNNER_TEMP/qemu-cpu.txt"

      - name: Wait for the Dockur web viewer and container health
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 200); do
            state="$(docker inspect --format '{{.State.Status}}' gnx-dockur 2>/dev/null || true)"
            [[ "$state" == running ]] || { echo '::error::Dockur exited before the web viewer became ready.'; exit 1; }
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8006/ >/dev/null; then ready=true; break; fi
            (( attempt % 20 == 0 )) && echo "Waiting for Dockur web viewer: ${attempt}/200"
            sleep 15
          done
          [[ "$ready" == true ]] || { echo '::error::Dockur web viewer did not become ready within 50 minutes.'; exit 1; }

      - name: Publish tailnet-authenticated noVNC
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale serve --bg --https=443 http://127.0.0.1:8006
          # Port 3389 reuses the existing tag:github-rdp ACL, but forwards the
          # Dockur web viewer rather than the guest RDP listener.
          sudo tailscale serve --bg --tcp=3389 tcp://127.0.0.1:8006
          sudo tailscale serve status --json | tee "$RUNNER_TEMP/tailscale-serve.json" >/dev/null
          dns_name="$(tailscale status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["Self"].get("DNSName", "").rstrip("."))')"
          [[ -n "$dns_name" ]] || { echo '::error::Tailscale did not provide a DNS name.'; exit 1; }
          {
            echo
            echo '## Interactive Windows session ready'
            echo
            echo "- Logical slot: ${SLOT} (a separate ephemeral compatibility session; not quorum or Corosync proof)"
            echo "- Preferred noVNC endpoint: https://${dns_name}/"
            echo "- Existing-ACL noVNC endpoint: http://${dns_name}:3389/ (HTTP at the application layer; authenticated and encrypted by Tailscale at the network layer, not HTTPS)"
            echo "- Session duration after viewer readiness: ${SESSION_MINUTES} minutes"
            # shellcheck disable=SC2016 # Backticks are literal documentation, not command substitutions.
            echo '- In Windows, open `C:\OEM`, run `01-Install-GNX.cmd`, allow real reboots, run `02-Configure-GNX.cmd`, then run `03-Collect-GNX-Evidence.cmd`.'
            # shellcheck disable=SC2016 # Backticks are literal documentation, not command substitutions.
            echo '- The run succeeds early only after the host validates exported guest evidence: the expected installer hash, a detected GNX service, a `gnx.exe` hash, and either schema-valid `gnx status --json` output or the collector fixed nonzero-before-interactive-configuration category.'
            echo '- This hosted evidence rule is not G5 physical quorum, Corosync, direct-path, or cluster-network proof.'
            echo '- Both endpoints remain tailnet-only; no Funnel, RDP listener, password, or auth key is exposed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for valid exported guest evidence within the bounded interactive session
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$RUNNER_TEMP/gnx-shared/gnx-evidence/gnx-evidence.json"
          validator="$RUNNER_TEMP/validate-gnx-evidence.py"
          cat > "$validator" <<'PY'
          #!/usr/bin/env python3
          """Validate the fixed, allowlisted GNX guest-evidence envelope."""
          import copy
          import json
          import sys
          from pathlib import Path

          FIXED_STATUS_ERROR = 'status-command-exited-nonzero-before-interactive-configuration'
          TOP_LEVEL_KEYS = {'schemaVersion', 'collectedAtUtc', 'installerSha256', 'services', 'binaryHashes', 'gnxStatusJson', 'gnxStatusError'}
          SERVICE_KEYS = {'name', 'state', 'startMode', 'startName'}
          BINARY_KEYS = {'path', 'sha256'}

          def is_sha256(value):
              return isinstance(value, str) and len(value) == 64 and all(character in '0123456789abcdefABCDEF' for character in value)

          def has_exact_keys(value, expected):
              return isinstance(value, dict) and set(value) == expected

          def is_gnx_status(status):
              required = {'schema_version', 'overall', 'stage', 'role', 'controller', 'components', 'cluster', 'services'}
              allowed = required | {'last_error'}
              if not isinstance(status, dict) or set(status) - allowed or not required <= set(status):
                  return False
              if not isinstance(status['schema_version'], int) or isinstance(status['schema_version'], bool) or status['schema_version'] != 1:
                  return False
              if not all(isinstance(status[field], str) and status[field].strip() for field in ('overall', 'stage')):
                  return False
              if not all(status[field] is None or isinstance(status[field], str) for field in ('role', 'controller')):
                  return False
              if 'last_error' in status and status['last_error'] != 'reported':
                  return False
              component_keys = {'service', 'wsl', 'podman_machine', 'kvm', 'tailscale', 'tailscale_serve', 'proxmox', 'opentofu'}
              if not has_exact_keys(status['components'], component_keys) or not all(isinstance(value, str) for value in status['components'].values()):
                  return False
              if not has_exact_keys(status['cluster'], {'joined', 'quorate'}) or not all(isinstance(value, bool) for value in status['cluster'].values()):
                  return False
              return has_exact_keys(status['services'], {'garage', 'forgejo'}) and all(isinstance(value, str) for value in status['services'].values())

          def validate_report(report, expected_sha256):
              if not has_exact_keys(report, TOP_LEVEL_KEYS): return 'evidence envelope keys are invalid'
              if not isinstance(report['schemaVersion'], int) or isinstance(report['schemaVersion'], bool) or report['schemaVersion'] != 1: return 'evidence schema version is invalid'
              if not isinstance(report['collectedAtUtc'], str) or not report['collectedAtUtc'].strip(): return 'evidence collection time is invalid'
              if not is_sha256(report['installerSha256']) or report['installerSha256'].lower() != expected_sha256.lower(): return 'installer hash is missing or mismatched'
              services = report['services']
              if not isinstance(services, list) or len(services) != 1: return 'service evidence must contain exactly one service'
              service = services[0]
              if not has_exact_keys(service, SERVICE_KEYS) or not all(isinstance(value, str) for value in service.values()): return 'service evidence has invalid keys or types'
              if service['name'].casefold() != 'quetzalcoatl' or service['startName'].casefold() != r'nt service\quetzalcoatl': return 'service identity is invalid'
              binary_hashes = report['binaryHashes']
              if not isinstance(binary_hashes, list): return 'binary hashes are invalid'
              has_gnx_binary = False
              for binary in binary_hashes:
                  if not has_exact_keys(binary, BINARY_KEYS) or not all(isinstance(value, str) for value in binary.values()): return 'binary hash evidence has invalid keys or types'
                  if not is_sha256(binary['sha256']): return 'binary hash is invalid'
                  if binary['path'].replace('\\', '/').rsplit('/', 1)[-1].casefold() == 'gnx.exe': has_gnx_binary = True
              if not has_gnx_binary: return 'no installed gnx.exe hash'
              status_json = report['gnxStatusJson']
              status_error = report['gnxStatusError']
              if status_json is None:
                  return None if status_error == FIXED_STATUS_ERROR else 'gnx status output is missing or has an unsafe error category'
              if not isinstance(status_json, str) or not status_json.strip() or status_error is not None: return 'gnx status JSON and error combination is invalid'
              try: status = json.loads(status_json)
              except json.JSONDecodeError: return 'gnx status JSON is invalid'
              return None if is_gnx_status(status) else 'gnx status JSON has an invalid schema'

          def valid_status(last_error_marker=False):
              status = {'schema_version': 1, 'overall': 'ready', 'stage': 'configured', 'role': None, 'controller': None, 'components': {key: 'ok' for key in ('service', 'wsl', 'podman_machine', 'kvm', 'tailscale', 'tailscale_serve', 'proxmox', 'opentofu')}, 'cluster': {'joined': False, 'quorate': False}, 'services': {'garage': 'ok', 'forgejo': 'ok'}}
              if last_error_marker: status['last_error'] = 'reported'
              return status

          def valid_report(expected_sha256, status=True):
              return {'schemaVersion': 1, 'collectedAtUtc': '2026-01-01T00:00:00.0000000Z', 'installerSha256': expected_sha256, 'services': [{'name': 'Quetzalcoatl', 'state': 'Running', 'startMode': 'Auto', 'startName': r'NT SERVICE\Quetzalcoatl'}], 'binaryHashes': [{'path': r'\Quetzalcoatl\gnx.exe', 'sha256': expected_sha256}], 'gnxStatusJson': json.dumps(valid_status(last_error_marker=True)) if status else None, 'gnxStatusError': None if status else FIXED_STATUS_ERROR}

          def self_test():
              expected = 'a' * 64
              fixtures = [('valid status', valid_report(expected), True), ('valid fixed category', valid_report(expected, status=False), True)]
              report = valid_report(expected); report['unexpected'] = True; fixtures.append(('extra top-level key', report, False))
              report = valid_report(expected); report['services'][0]['extra'] = 'x'; fixtures.append(('extra service key', report, False))
              report = valid_report(expected); report['services'][0]['state'] = 1; fixtures.append(('wrong service type', report, False))
              report = valid_report(expected); report['binaryHashes'][0]['extra'] = 'x'; fixtures.append(('extra binary key', report, False))
              report = valid_report(expected); report['binaryHashes'][0]['sha256'] = 1; fixtures.append(('wrong binary type', report, False))
              report = valid_report(expected); report['services'][0]['name'] = 'fake-quetzalcoatl'; fixtures.append(('substring service name', report, False))
              report = valid_report(expected); report['services'][0]['startName'] = 'LocalSystem'; fixtures.append(('wrong service account', report, False))
              report = valid_report(expected); report['services'].append(copy.deepcopy(report['services'][0])); fixtures.append(('multiple services', report, False))
              report = valid_report(expected); report['gnxStatusError'] = FIXED_STATUS_ERROR; fixtures.append(('status and error together', report, False))
              for name, report, should_pass in fixtures:
                  accepted = validate_report(report, expected) is None
                  if accepted != should_pass: raise AssertionError(f'fixture failed: {name}')
                  if not should_pass and accepted: raise AssertionError(f'invalid fixture could be copied: {name}')
              assert 'last_error' not in valid_status()
              assert valid_status(last_error_marker=True)['last_error'] == 'reported'

          def main(argv):
              if argv == ['--self-test']:
                  self_test()
                  return 0
              if len(argv) != 2: return 1
              try: report = json.loads(Path(argv[0]).read_text(encoding='utf-8-sig'))
              except (OSError, UnicodeError, json.JSONDecodeError): return 1
              return 0 if validate_report(report, argv[1]) is None else 1

          if __name__ == '__main__': raise SystemExit(main(sys.argv[1:]))
          PY
          python3 "$validator" --self-test
          finish_at=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          while (( $(date +%s) < finish_at )); do
            [[ "$(docker inspect --format '{{.State.Status}}' gnx-dockur 2>/dev/null || true)" == running ]] || { echo '::error::Dockur stopped before the bounded session ended.'; exit 1; }
            if python3 "$validator" "$evidence_path" "$EXPECTED_SHA256" >/dev/null 2>&1; then
              echo 'Validated exported GNX guest evidence; ending the interactive session early.'
              exit 0
            fi
            echo "[$(date --iso-8601=seconds)] Waiting for valid exported GNX evidence; guest reboots may temporarily interrupt noVNC."
            sleep 60
          done
          echo '::error::Interactive session expired without valid exported GNX evidence.'
          exit 1

      - name: Collect allowlisted host and guest evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/redacted-evidence"
          mkdir -p "$evidence"
          docker inspect gnx-dockur 2>/dev/null |
            jq 'map({Id, Image, Created, State, HostConfig: {Memory: .HostConfig.Memory, NanoCpus: .HostConfig.NanoCpus, Devices: .HostConfig.Devices, PortBindings: .HostConfig.PortBindings}, Mounts: [.Mounts[] | {Type, Destination, RW}]})' \
            > "$evidence/dockur-inspect.json" || true
          df -h / > "$evidence/host-disk.txt"
          cp "$RUNNER_TEMP/kvm-capabilities.txt" "$evidence/kvm-capabilities.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/qemu-cpu.txt" "$evidence/qemu-cpu.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/tailscale-serve.json" "$evidence/tailscale-serve.json" 2>/dev/null || true
          validator="$RUNNER_TEMP/validate-gnx-evidence.py"
          source_evidence="$RUNNER_TEMP/gnx-shared/gnx-evidence/gnx-evidence.json"
          if [[ -f "$validator" ]] && python3 "$validator" "$source_evidence" "$EXPECTED_SHA256" >/dev/null 2>&1; then
            cp "$source_evidence" "$evidence/gnx-evidence.json"
          else
            printf '%s\n' 'gnx-evidence-missing-or-invalid' > "$evidence/gnx-evidence-invalid-or-missing.txt"
          fi

      - name: Upload short-lived evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnx-dockur-${{ inputs.slot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/redacted-evidence
          retention-days: 1
          if-no-files-found: warn

      - name: Cleanup the ephemeral guest and tailnet Serve endpoint
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale serve reset
          docker stop --time 120 gnx-dockur
          docker rm --force gnx-dockur
