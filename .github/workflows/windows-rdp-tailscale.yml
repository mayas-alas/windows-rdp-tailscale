name: GNX Dockur interactive compatibility lab

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Test prerelease tag containing the frozen GNX setup asset
        required: true
        type: string
      expected_sha256:
        description: SHA-256 for Quetzalcoatl-0.3.0-preview-setup-x64.exe
        required: true
        type: string
      slot:
        description: Deterministic logical compatibility slot
        required: true
        default: controller
        type: choice
        options: [controller, member-1, member-2]
      session_minutes:
        description: Bounded interactive noVNC session after the viewer is ready
        required: true
        default: "120"
        type: choice
        options: ["60", "120", "180"]
permissions:
  contents: read

concurrency:
  group: gnx-dockur-${{ github.repository }}-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  dockur-compatibility:
    name: Dockur ${{ inputs.slot }} interactive compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      DOCKUR_IMAGE: docker.io/dockurr/windows@sha256:8cc6f8bc4a60c078141fd3bcf7d2df69ae063a11d98be31a57429afe0dca66da
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      SLOT: ${{ inputs.slot }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}

    steps:
      - name: Validate inputs and access secrets
        shell: bash
        env:
          TS_RDP_AUTH_KEY: ${{ secrets.TS_RDP_AUTH_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo '::error::Invalid release_tag.'; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo '::error::expected_sha256 must be 64 hexadecimal characters.'; exit 1; }
          [[ "$SLOT" =~ ^(controller|member-1|member-2)$ ]] || { echo '::error::Invalid logical slot.'; exit 1; }
          [[ "$SESSION_MINUTES" =~ ^(60|120|180)$ ]] || { echo '::error::Invalid session duration.'; exit 1; }
          [[ -n "$TS_RDP_AUTH_KEY" ]] || { echo '::error::Missing TS_RDP_AUTH_KEY for authenticated noVNC.'; exit 1; }

      - name: Reclaim ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            [[ -e "$path" ]] && sudo rm -rf -- "$path"
          done
          sudo apt-get clean
          docker system prune --all --force --volumes
          df -h /

      - name: Gate KVM API 12, nested virtualization, TUN, memory, and disk
        shell: bash
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]] || { echo '::error::The runner does not expose /dev/kvm.'; exit 1; }
          [[ -c /dev/net/tun ]] || { echo '::error::The runner does not expose /dev/net/tun.'; exit 1; }
          sudo chmod 0666 /dev/kvm
          python3 - <<'PY'
          import fcntl
          import os
          fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          try:
              api = fcntl.ioctl(fd, 0xAE00, 0)
          finally:
              os.close(fd)
          if api != 12:
              raise SystemExit(f'KVM API version is {api}, expected 12')
          print('KVM_API_VERSION=12')
          PY
          grep -Eqm1 '(^|[[:space:]])(vmx|svm)($|[[:space:]])' /proc/cpuinfo || { echo '::error::VMX/SVM is unavailable.'; exit 1; }
          nested=''
          for parameter in /sys/module/kvm_intel/parameters/nested /sys/module/kvm_amd/parameters/nested; do
            if [[ -r "$parameter" ]]; then nested="$(tr -d '[:space:]' < "$parameter")"; break; fi
          done
          [[ "${nested^^}" == Y || "$nested" == 1 ]] || { echo '::error::Nested KVM is not enabled.'; exit 1; }
          memory_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          free_disk_gib="$(df -Pk / | awk 'NR == 2 {print int($4 / 1024 / 1024)}')"
          (( memory_kib >= 15 * 1024 * 1024 )) || { echo '::error::Need at least 15 GiB host RAM.'; exit 1; }
          (( free_disk_gib >= 36 )) || { echo "::error::Need 36 GiB free disk; found ${free_disk_gib} GiB."; exit 1; }
          {
            echo '## Dockur compatibility preflight'
            echo
            echo "- Logical slot: ${SLOT}"
            echo "- KVM API: 12; nested KVM: ${nested}; TUN: available"
            echo "- Host RAM: $((memory_kib / 1024 / 1024)) GiB; free disk: ${free_disk_gib} GiB"
            echo '- Evidence class: hosted interactive compatibility session, not physical-lab cluster acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify frozen installer on the Linux host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oem"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Quetzalcoatl-0.3.0-preview-setup-x64.exe' --dir "$RUNNER_TEMP/oem"
          installer="$RUNNER_TEMP/oem/Quetzalcoatl-0.3.0-preview-setup-x64.exe"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          [[ "${actual,,}" == "${EXPECTED_SHA256,,}" ]] || { echo '::error::Frozen installer SHA-256 mismatch.'; exit 1; }

      - name: Create user-invoked guest helpers
        shell: bash
        run: |
          set -euo pipefail
          oem="$RUNNER_TEMP/oem"
          cat > "$oem/Install-GnxElevated.ps1" <<'PS'
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PSScriptRoot 'Quetzalcoatl-0.3.0-preview-setup-x64.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Frozen installer is missing: $installer" }
          Start-Process -FilePath $installer -Verb RunAs -Wait
          PS
          cat > "$oem/Repair-GnxElevated.ps1" <<'PS'
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PSScriptRoot 'Quetzalcoatl-0.3.0-preview-setup-x64.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Frozen installer is missing: $installer" }
          Start-Process -FilePath $installer -ArgumentList '/repair' -Verb RunAs -Wait
          PS
          cat > "$oem/Uninstall-GnxElevated.ps1" <<'PS'
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PSScriptRoot 'Quetzalcoatl-0.3.0-preview-setup-x64.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Frozen installer is missing: $installer" }
          Start-Process -FilePath $installer -ArgumentList '/uninstall' -Verb RunAs -Wait
          PS
          cat > "$oem/Collect-GnxEvidence.ps1" <<'PS'
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $desktop = [Environment]::GetFolderPath([Environment+SpecialFolder]::Desktop)
          $sharedRoots = @('Z:\')
          if (-not [string]::IsNullOrWhiteSpace($desktop)) {
            $sharedRoots += Join-Path $desktop 'Shared'
          }
          $out = $null
          foreach ($sharedRoot in $sharedRoots) {
            if (-not (Test-Path -LiteralPath $sharedRoot -PathType Container)) { continue }
            $probe = $null
            try {
              $candidate = Join-Path $sharedRoot 'gnx-evidence'
              New-Item -ItemType Directory -Force -Path $candidate | Out-Null
              $probe = Join-Path $candidate ('.gnx-write-probe-{0}.tmp' -f [guid]::NewGuid().ToString('N'))
              Set-Content -LiteralPath $probe -Value 'probe' -NoNewline -Encoding ascii
              Remove-Item -LiteralPath $probe -Force
              $out = $candidate
              break
            } catch {
              if ($null -ne $probe) { Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue }
              # Try the next documented Dockur shared-root location.
            }
          }
          if ($null -eq $out) {
            throw 'No supported writable Dockur shared root was found (checked Z:\ and the current user Desktop\Shared folder); evidence was not written.'
          }
          $installer = Join-Path $PSScriptRoot 'Quetzalcoatl-0.3.0-preview-setup-x64.exe'
          $report = [ordered]@{ schemaVersion = 1; collectedAtUtc = (Get-Date).ToUniversalTime().ToString('o'); installerSha256 = $null; services = @(); binaryHashes = @(); gnxStatusJson = $null; gnxStatusError = $null }
          if (Test-Path -LiteralPath $installer) { $report.installerSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash }
          $report.services = @(Get-CimInstance Win32_Service | Where-Object { $_.PathName -match '(?i)quetzalcoatl|gnx' -or $_.Name -match '(?i)quetzalcoatl|gnx' } | ForEach-Object { [ordered]@{ name=$_.Name; state=$_.State; startMode=$_.StartMode; startName=$_.StartName } })
          $roots = @((Join-Path $env:ProgramFiles 'Quetzalcoatl'), (Join-Path ${env:ProgramFiles(x86)} 'Quetzalcoatl')) | Where-Object { Test-Path -LiteralPath $_ }
          $binaries = @(foreach ($root in $roots) { Get-ChildItem -LiteralPath $root -Recurse -File -Include *.exe,*.dll })
          $report.binaryHashes = @($binaries | ForEach-Object { [ordered]@{ path=$_.FullName.Substring($env:ProgramFiles.Length); sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } })
          $gnx = @($binaries | Where-Object { $_.Name -ieq 'gnx.exe' } | Select-Object -First 1)
          if ($gnx) {
            try { $report.gnxStatusJson = (& $gnx.FullName status --json | Out-String).Trim(); if ($LASTEXITCODE -ne 0) { throw "gnx status --json exited $LASTEXITCODE" } }
            catch { $report.gnxStatusError = $_.Exception.Message }
          } else { $report.gnxStatusError = 'GNX is not installed; gnx status --json was not run.' }
          $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $out 'gnx-evidence.json') -Encoding utf8
          PS
          cat > "$oem/01-Install-GNX.cmd" <<'BAT'
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0Install-GnxElevated.ps1"
          pause
          BAT
          cat > "$oem/02-Configure-GNX.cmd" <<'BAT'
          @echo off
          "%ProgramFiles%\Quetzalcoatl\gnx.exe" configure
          pause
          BAT
          cat > "$oem/03-Collect-GNX-Evidence.cmd" <<'BAT'
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0Collect-GnxEvidence.ps1"
          pause
          BAT
          cat > "$oem/90-Repair-GNX.cmd" <<'BAT'
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0Repair-GnxElevated.ps1"
          pause
          BAT
          cat > "$oem/99-Uninstall-GNX.cmd" <<'BAT'
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0Uninstall-GnxElevated.ps1"
          pause
          BAT
          test ! -e "$oem/install.bat"

      - name: Connect noVNC edge to the tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TS_RDP_AUTH_KEY }}
          tags: tag:github-rdp
          hostname: github-dockur-${{ inputs.slot }}-${{ github.run_id }}
          version: 1.98.8
          timeout: 3m
          retry: '5'
          use-cache: 'true'

      - name: Start the pinned Dockur Windows guest
        shell: bash
        run: |
          set -euo pipefail
          storage="$RUNNER_TEMP/gnx-windows-storage"
          shared="$RUNNER_TEMP/gnx-shared"
          mkdir -p "$storage" "$shared"
          password="$(openssl rand -hex 32)"
          export PASSWORD="$password"
          docker pull "$DOCKUR_IMAGE"
          docker_args=(
            --detach --name gnx-dockur --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
            --env VERSION=11 --env CPU_CORES=6 --env RAM_SIZE=12G --env DISK_SIZE=100G --env VMX=Y
            --env LANGUAGE=English --env REGION=en-US --env KEYBOARD=en-US --env USERNAME=gnxlab --env PASSWORD
            --publish 127.0.0.1:8006:8006/tcp
            --volume "$storage:/storage" --volume "$RUNNER_TEMP/oem:/oem:ro" --volume "$shared:/shared"
            --stop-timeout 120
          )
          docker run "${docker_args[@]}" "$DOCKUR_IMAGE"
          unset PASSWORD password

      - name: Wait for the Dockur web viewer and container health
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 200); do
            state="$(docker inspect --format '{{.State.Status}}' gnx-dockur 2>/dev/null || true)"
            [[ "$state" == running ]] || { echo '::error::Dockur exited before the web viewer became ready.'; exit 1; }
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8006/ >/dev/null; then ready=true; break; fi
            (( attempt % 20 == 0 )) && echo "Waiting for Dockur web viewer: ${attempt}/200"
            sleep 15
          done
          [[ "$ready" == true ]] || { echo '::error::Dockur web viewer did not become ready within 50 minutes.'; exit 1; }

      - name: Publish tailnet-authenticated noVNC
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale serve --bg --https=443 http://127.0.0.1:8006
          # Port 3389 reuses the existing tag:github-rdp ACL, but forwards the
          # Dockur web viewer rather than the guest RDP listener.
          sudo tailscale serve --bg --tcp=3389 tcp://127.0.0.1:8006
          sudo tailscale serve status --json > "$RUNNER_TEMP/tailscale-serve.json"
          dns_name="$(tailscale status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["Self"].get("DNSName", "").rstrip("."))')"
          [[ -n "$dns_name" ]] || { echo '::error::Tailscale did not provide a DNS name.'; exit 1; }
          {
            echo
            echo '## Interactive Windows session ready'
            echo
            echo "- Logical slot: ${SLOT} (a separate ephemeral compatibility session; not quorum or Corosync proof)"
            echo "- Preferred noVNC endpoint: https://${dns_name}/"
            echo "- Existing-ACL noVNC endpoint: http://${dns_name}:3389/ (HTTP at the application layer; authenticated and encrypted by Tailscale at the network layer, not HTTPS)"
            echo "- Session duration after viewer readiness: ${SESSION_MINUTES} minutes"
            echo '- In Windows, open `C:\OEM`, run `01-Install-GNX.cmd`, allow real reboots, run `02-Configure-GNX.cmd`, then run `03-Collect-GNX-Evidence.cmd`.'
            echo '- Web viewer availability is not GNX acceptance. Acceptance requires genuine `gnx status --json` evidence in Dockur shared folder (`Z:\gnx-evidence` when available, otherwise `Desktop\Shared\gnx-evidence`).'
            echo '- Both endpoints remain tailnet-only; no Funnel, RDP listener, password, or auth key is exposed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the interactive session bounded
        shell: bash
        run: |
          set -euo pipefail
          finish_at=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          while (( $(date +%s) < finish_at )); do
            [[ "$(docker inspect --format '{{.State.Status}}' gnx-dockur 2>/dev/null || true)" == running ]] || { echo '::error::Dockur stopped before the bounded session ended.'; exit 1; }
            echo "[$(date --iso-8601=seconds)] Dockur container remains running; guest reboots may temporarily interrupt noVNC."
            sleep 60
          done

      - name: Collect bounded host diagnostics and redacted guest evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/redacted-evidence"
          mkdir -p "$evidence"
          docker inspect gnx-dockur 2>/dev/null |
            jq 'map({Id, Image, Created, State, HostConfig: {Memory: .HostConfig.Memory, NanoCpus: .HostConfig.NanoCpus, Devices: .HostConfig.Devices, PortBindings: .HostConfig.PortBindings}, Mounts: [.Mounts[] | {Type, Destination, RW}]})' \
            > "$evidence/dockur-inspect.json" || true
          df -h / > "$evidence/host-disk.txt"
          cp "$RUNNER_TEMP/tailscale-serve.json" "$evidence/tailscale-serve.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/gnx-shared/gnx-evidence/gnx-evidence.json" "$evidence/gnx-evidence.json" 2>/dev/null || true
          find "$evidence" -type f -print0 | xargs -0r sed -Ei 's/(password|auth.?key|credential)[[:space:]]*[:=][[:space:]]*[^,[:space:]]+/\1=[REDACTED]/Ig'

      - name: Upload short-lived evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnx-dockur-${{ inputs.slot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/redacted-evidence
          retention-days: 1
          if-no-files-found: warn

      - name: Cleanup the ephemeral guest and tailnet Serve endpoint
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale serve reset
          docker stop --time 120 gnx-dockur
          docker rm --force gnx-dockur
